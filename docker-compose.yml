services:
  db:
    image: postgres:16-alpine
    container_name: glymphocare_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-glympho}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-glympho_secret_2026}
      POSTGRES_DB: ${POSTGRES_DB:-glymphocare}
      TZ: America/Lima
    ports:
      - "5433:5432"
    volumes:
      - glymphocare_pgdata:/var/lib/postgresql/data
      - ./database/01_oltp_schema.sql:/docker-entrypoint-initdb.d/01_oltp_schema.sql:ro
      - ./database/02_datamart_star_schema.sql:/docker-entrypoint-initdb.d/02_datamart_star_schema.sql:ro
      - ./database/03_seed_reglas_base.sql:/docker-entrypoint-initdb.d/03_seed_reglas_base.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glympho -d glymphocare"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  glymphocare_pgdata:
